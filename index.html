<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timber Intel | WI Market Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo-box">TMI</div>
        <div>
            <h1>Timber Market Intelligence</h1>
            <p class="subtitle">Wisconsin North-Central Region</p>
        </div>
    </div>
    <div id="save-indicator">Data Localized</div>
</header>

<div class="container">
    <nav class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('setup', this)">1. Inventory</button>
        <button class="nav-tab" onclick="switchTab('market', this)">2. Market</button>
        <button class="nav-tab" onclick="switchTab('analysis', this)">3. Analysis</button>
    </nav>

    <section id="setup" class="tab-content">
        <div class="grid-2">
            <div class="card">
                <h2>Species Composition (%)</h2>
                <div class="input-grid">
                    <div class="input-group">
                        <label>Hard Maple</label>
                        <input type="number" class="sp-pct" data-sp="maple" value="40">
                    </div>
                    <div class="input-group">
                        <label>Red Oak</label>
                        <input type="number" class="sp-pct" data-sp="oak" value="30">
                    </div>
                    <div class="input-group">
                        <label>White Pine</label>
                        <input type="number" class="sp-pct" data-sp="pine" value="20">
                    </div>
                    <div class="input-group">
                        <label>Aspen</label>
                        <input type="number" class="sp-pct" data-sp="aspen" value="10">
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Volume Metrics</h2>
                <div class="input-group">
                    <label>Total Acres</label>
                    <input type="number" id="total-acres" value="40">
                </div>
                <div class="input-group">
                    <label>Estimated MBF / Acre</label>
                    <input type="number" id="avg-mbf" value="2.5" step="0.1">
                </div>
            </div>
        </div>
    </section>

    <section id="market" class="tab-content" style="display:none;">
        <div class="card">
            <h2>Delivered Mill Prices ($/MBF)</h2>
            <div class="grid-3">
                <div class="input-group"><label>Hardwood</label><input type="number" id="p-hardwood" value="550"></div>
                <div class="input-group"><label>Softwood/Pine</label><input type="number" id="p-pine" value="380"></div>
                <div class="input-group"><label>Pulp/Aspen</label><input type="number" id="p-pulp" value="240"></div>
            </div>
        </div>
    </section>

    <section id="analysis" class="tab-content" style="display:none;">
        <div class="grid-main">
            <div class="col">
                <div class="card highlight">
                    <label>Est. Net Stumpage Value</label>
                    <div id="net-value-display" class="metric-hero">$0</div>
                    <p id="valuation-subtext"></p>
                </div>
                <div class="card chart-container">
                    <canvas id="speciesChart"></canvas>
                </div>
            </div>
            <div class="col">
                <div class="card dark">
                    <h3>Harvesting Costs</h3>
                    <p class="hint">Logging + Hauling</p>
                    <input type="range" id="harvest-cost" min="100" max="300" value="160">
                    <div class="range-labels">
                        <span>$100</span>
                        <span id="cost-val">$160</span>
                        <span>$300</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
