<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timber Intel | Stewardship Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo-box">TMI</div>
        <div>
            <h1>Timber Market Intelligence</h1>
            <p class="subtitle">Evidence-Based Stewardship</p>
        </div>
    </div>
    <div id="save-status">● Draft Saved</div>
</header>

<div class="container">
    <nav class="nav-tabs">
        <button class="nav-tab active" data-target="inventory" onclick="switchTab(this)">1. Profile</button>
        <button class="nav-tab" data-target="market" onclick="switchTab(this)">2. Market</button>
        <button class="nav-tab" data-target="analysis" onclick="switchTab(this)">3. Analysis</button>
    </nav>

    <section id="inventory" class="tab-content">
        <div class="grid-2">
            <div class="card">
                <h2>Species & Volume</h2>
                <div class="input-grid">
                    <div class="input-group"><label>Hard Maple %</label><input type="number" id="maple-pct" value="40" oninput="autoSave()"></div>
                    <div class="input-group"><label>Red Oak %</label><input type="number" id="oak-pct" value="30" oninput="autoSave()"></div>
                    <div class="input-group"><label>White Pine %</label><input type="number" id="pine-pct" value="20" oninput="autoSave()"></div>
                    <div class="input-group"><label>Aspen %</label><input type="number" id="aspen-pct" value="10" oninput="autoSave()"></div>
                </div>
                <div class="input-group" style="margin-top: 20px;">
                    <label>Total Harvest Volume (MBF)</label>
                    <input type="number" id="total-mbf" value="100" oninput="autoSave()">
                </div>
            </div>
            <div class="card">
                <h2>Biological Growth</h2>
                <div class="input-group">
                    <label>Veneer Grade Ratio (%)</label>
                    <input type="range" id="veneer-ratio" min="0" max="40" value="8" oninput="autoSave()">
                    <div class="range-val"><span id="veneer-val">8</span>% Veneer</div>
                </div>
                <div class="input-group">
                    <label>Annual Growth Rate (%)</label>
                    <input type="number" id="bio-growth" value="3.8" step="0.1" oninput="autoSave()">
                </div>
            </div>
        </div>
    </section>

    <section id="market" class="tab-content" style="display:none;">
        <div class="grid-2">
            <div class="card">
                <h2>Market Access</h2>
                <div class="input-group">
                    <label>Mill Distance (Miles)</label>
                    <input type="number" id="mill-dist" value="35" oninput="autoSave()">
                </div>
                <div class="input-group">
                    <label>Current Market Cycle</label>
                    <select id="market-cycle" onchange="autoSave()">
                        <option value="1.15">High Demand (Seller's Market)</option>
                        <option value="1.0" selected>Stable / Average</option>
                        <option value="0.80">Low Demand (Buyer's Market)</option>
                    </select>
                </div>
            </div>
            <div class="card">
                <h2>Incentives</h2>
                <div class="input-group">
                    <label>MFL Enrollment</label>
                    <select id="mfl-enrolled" onchange="autoSave()">
                        <option value="yes">Yes (Tax Advantage)</option>
                        <option value="no" selected>No (Full Tax Load)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Logging Season</label>
                    <select id="season" onchange="autoSave()">
                        <option value="0">Standard (Dry)</option>
                        <option value="45">Frozen Ground Premium (+$45/MBF)</option>
                        <option value="-30">Spring / Wet (-$30/MBF)</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <section id="analysis" class="tab-content" style="display:none;">
        <div class="grid-main">
            <div class="col">
                <div class="card highlight">
                    <label>Net Liquid Value (Estimated Today)</label>
                    <div id="net-value-display" class="metric-hero">$0</div>
                    <p id="valuation-subtext" class="hint"></p>
                </div>
                <div class="card chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
            <div class="col">
                <div class="card dark">
                    <h3>The Stewardship Edge</h3>
                    <div id="strategy-output"></div>
                </div>
                <div class="card">
                    <h3>Biological "Interest" (1 Year)</h3>
                    <div id="growth-premium" style="font-size: 1.8rem; color: #d4af37; font-weight: 800;">$0</div>
                    <p class="hint">Value added by volume growth alone, ignoring market price changes.</p>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
